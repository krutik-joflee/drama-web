<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DramaBox - Opening...</title>
    <!-- Use a modern font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0050;
            --bg: #0a0a0a;
            --text: #ffffff;
            --text-secondary: #a0a0a0;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 400px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .logo-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
        }
        .loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        .logo-circle {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), #ff4d8d);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.4);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 1.8rem; margin: 0 0 10px; font-weight: 600; letter-spacing: -0.5px; }
        p { color: var(--text-secondary); font-size: 1rem; line-height: 1.5; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary), #ff4d8d);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 0, 80, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 0, 80, 0.4);
        }
        .btn:active { transform: scale(0.96); }
        
        /* Smooth fade-in animation */
        .container {
            animation: fadeInUp 0.8s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="loader"></div>
            <div class="logo-circle">D</div>
        </div>
        <h1>Opening DramaBox</h1>
        <p>Wait a moment while we take you to the reel...</p>
        <a id="redirect-btn" href="#" class="btn">Open Manually</a>
    </div>

    <script>
        // Configuration
        const packageName = 'com.myapp.demo'; 
        const appScheme = 'dramabox';
        const playStoreUrl = `https://play.google.com/store/apps/details?id=${packageName}`;
        
        // Parse Query Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('bookId');
        const chapterIndex = urlParams.get('chapterIndex') || '0';
        
        if (!bookId) {
            // Fallback if no bookId provided
            window.location.href = playStoreUrl;
        }

        // Deep Link URIs
        const appUri = `${appScheme}://open?bookId=${bookId}&chapterIndex=${chapterIndex}`;
        
        // For Android: Intent URL is the most robust way to handle "Not Installed" fallback
        // Chrome and other Android browsers will automatically follow browser_fallback_url if the app isn't found.
        const intentUrl = `intent://open?bookId=${bookId}&chapterIndex=${chapterIndex}#Intent;scheme=${appScheme};package=${packageName};S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

        // Update Button Link
        const redirectUrl = isAndroid ? intentUrl : appUri;
        document.getElementById('redirect-btn').href = redirectUrl;

        function doRedirect() {
            if (isAndroid) {
                // Android handles everything via Intent URL
                window.location.href = intentUrl;
            } else if (isIOS) {
                // iOS logic: Try to open app, fallback to store if it doesn't open
                window.location.href = appUri;
                setTimeout(() => {
                    // Replace with actual App Store link if available
                    window.location.href = playStoreUrl; 
                }, 2500);
            } else {
                // Desktop fallback
                window.location.href = playStoreUrl;
            }
        }

        // Start redirection process
        window.onload = () => {
            setTimeout(doRedirect, 500); // Small delay for visual effect
        };
    </script>
</body>
</html>
